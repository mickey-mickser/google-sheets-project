  title: Google Sheets API
  version: "1.0"
paths:
  /api/v1/sheets/clearTable:
    post:
      consumes:
      - application/json
      description: This endpoint clear table in a Google Sheets document
      parameters:
      - description: Sheet ID
        in: query
        name: sheet_id
        required: true
        type: string
      - description: Range
        in: query
        name: range
        type: string
      - description: Delete request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully clear table
          schema:
            $ref: '#/definitions/responses.ClearValuesResponse'
        "400":
          description: Missing required parameters
          schema:
            $ref: '#/definitions/responses.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/responses.ResponseError'
      summary: ClearTable data from Google Sheets
      tags:
      - Sheets
  /api/v1/sheets/create:
    post:
      consumes:
      - application/json
      description: This endpoint creates a new table in Google Sheets based on the
        provided request body
      parameters:
      - description: Table Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully created table
          schema:
            $ref: '#/definitions/responses.Spreadsheet'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/responses.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/responses.ResponseError'
      summary: Create a new table in Google Sheets
      tags:
      - Sheets
  /api/v1/sheets/read:
    get:
      consumes:
      - application/json
      description: This endpoint retrieves a specified range of data from a Google
        Sheets document
      parameters:
      - description: Sheet ID
        in: query
        name: sheet_id
        required: true
        type: string
      - description: Range
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved data
          schema:
            items:
              items: {}
              type: array
            type: array
        "400":
          description: Missing Sheet ID or invalid parameters
          schema:
            $ref: '#/definitions/responses.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/responses.ResponseError'
      summary: Get data from Google Sheets
      tags:
      - Sheets
  /api/v1/sheets/update:
    post:
      consumes:
      - application/json
      description: Accepts a list of updates and applies them to the specified Google
        Sheet.
      parameters:
      - description: Google Sheet ID
        in: query
        name: sheet_id
        required: true
        type: string
      - description: List of updates...
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BatchUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success response with status and data
          schema:
            $ref: '#/definitions/responses.BatchUpdateValuesResponse'
        "400":
          description: Bad request with error message
          schema:
            $ref: '#/definitions/responses.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/responses.ResponseError'
      summary: Batch update Google Sheets
      tags:
      - Sheets
schemes:
- http
swagger: "2.0"
